pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'minecraft-utility-mods'

include 'infinite-water'
include 'mining-reach'
include 'beacon-range'
include 'elytra-speed'
include 'villager-lead'
