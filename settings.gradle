pluginManagement {
	repositories {
		maven {
			name = 'MinecraftForge'
			url = 'https://maven.minecraftforge.net/'
		}
		gradlePluginPortal()
		mavenCentral()
	}
}

plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'minecraft-utility-mods'

include 'infinite-water'
include 'mining-reach'
include 'beacon-range'
include 'elytra-speed'
include 'villager-lead'
